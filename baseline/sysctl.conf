# A host baseline: review forwarding settings before using this on a router.
kern.nosuidcoredump=1
net.inet.ip.forwarding=0
net.inet6.ip6.forwarding=0
net.inet.ip.sourceroute=0
net.inet.icmp.rediraccept=0
# OpenBSD 7.9 has no IPv6 rediraccept sysctl. Zero prevents dynamic routes
# from being added through IPv6 redirects.
net.inet6.ip6.maxdynroutes=0
