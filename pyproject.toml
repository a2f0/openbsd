[project]
name = "openbsd-automation"
version = "0.1.0"
description = "OpenBSD VM provisioning and security baseline tooling"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["tclint==0.9.0", "shellcheck-py==0.11.0.1"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.tclint]
extensions = ["exp", "tcl"]
commands = ["expect"]
exclude = [".venv*/", ".ansible/", ".git/"]

[tool.tclint.style]
indent = 4
line-length = 100
max-blank-lines = 1
