[project]
name = "openbsd-automation"
version = "0.1.0"
description = "OpenBSD VM provisioning and security baseline tooling"
requires-python = ">=3.14,<3.16"
dependencies = []

[dependency-groups]
dev = ["tclint==0.9.0", "shellcheck-py==0.11.0.1"]

[tool.uv]
package = false
default-groups = ["dev"]
# New security patch published after uv 0.13.4; see docs/dependency-upgrades.md.
python-downloads-json-url = "https://raw.githubusercontent.com/astral-sh/uv/a02d446bcddd8a00c98084709b6bdccbc9a8208f/crates/uv-python-managed/download-metadata.json"

[tool.tclint]
extensions = ["exp", "tcl"]
commands = ["expect"]
exclude = [".venv*/", ".ansible/", ".git/"]

[tool.tclint.style]
indent = 4
line-length = 100
max-blank-lines = 1
