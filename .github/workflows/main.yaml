name: main

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up controller tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.13
      - name: Install locked agent tooling
        run: bun install --frozen-lockfile
      - name: Check managed agent skills
        run: bun run agents:check
      - name: Install locked dependencies
        run: make deps
      - name: Lint Expect and shell scripts
        run: make lint syntax test

  check:
    needs: lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned uv
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.13
          install_args: uv

      - name: Install locked dependencies
        run: make deps

      - name: Install expect and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y expect qemu-system-x86 wget coreutils

      - name: Test provisioning preflight guards
        run: make test-provisioning

      - name: Generate throwaway ssh key
        id: ssh-key
        run: |
          ssh-keygen -q -t ed25519 -N "" -C ci -f "$RUNNER_TEMP/ci_ssh_key"
          echo "public-key=$(cat "$RUNNER_TEMP/ci_ssh_key.pub")" >> "$GITHUB_OUTPUT"

      - name: Run QEMU OpenBSD installation
        run: |
          ./qemu.exp --dry-run
          ./qemu.exp
        timeout-minutes: 30
        env:
          USER_PASSWORD: CICD
          ROOT_PASSWORD: CICD
          SSH_PUBLIC_KEY: ${{ steps.ssh-key.outputs.public-key }}

      - name: Check logins, apply the baseline, and verify idempotence
        run: |
          ./boot.exp --check-hardened
          ./boot.exp --verify-hardened
        timeout-minutes: 20
        env:
          USER_PASSWORD: CICD
          ROOT_PASSWORD: CICD
          SSH_IDENTITY_FILE: ${{ runner.temp }}/ci_ssh_key
