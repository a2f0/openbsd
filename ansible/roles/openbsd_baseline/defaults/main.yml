---
# Patching is an explicit maintenance operation; it can require a reboot.
openbsd_baseline_apply_syspatches: false
openbsd_baseline_update_packages: false

# Empty by default because service requirements depend on the host's purpose.
openbsd_baseline_disabled_services: []

# OpenBSD-native settings for a host, rather than a router.
openbsd_baseline_sysctls:
  kern.nosuidcoredump: "1"
  net.inet.ip.forwarding: "0"
  net.inet6.ip6.forwarding: "0"
  net.inet.ip.sourceroute: "0"
  net.inet.icmp.rediraccept: "0"
  # A zero limit prevents IPv6 redirects from creating dynamic routes.
  net.inet6.ip6.maxdynroutes: "0"

openbsd_baseline_ssh_max_auth_tries: 3
openbsd_baseline_ssh_login_grace_time: 30
openbsd_baseline_ssh_disable_forwarding: true
